# Production deployment: MongoDB (single-node replica set), the API, and Caddy serving the
# frontend over HTTPS. Copy .env.example to .env, fill it in, then:  docker compose up -d --build
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Transactions need a replica set; this starts it on the very first boot.
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      GPA_TRACKER_MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      GPA_TRACKER_SECRET_KEY: ${GPA_TRACKER_SECRET_KEY:?Set GPA_TRACKER_SECRET_KEY in .env}
      GPA_TRACKER_COOKIE_SECURE: "true"
      GPA_TRACKER_APP_URL: https://${SITE_ADDRESS:-localhost}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data  # certificates
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  caddy-data:
